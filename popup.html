<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Limit Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="tab-container">
      <div class="tab active" data-tab="usage">Usage</div>
      <div class="tab" data-tab="perplexity">Perplexity</div>
      <div class="tab" data-tab="settings">Settings</div>
    </div>

    <!-- Usage Tab -->
    <div class="tab-content active" id="usage">
      <div class="section glow">
        <h2>Usage Dashboard</h2>
        <table id="usageTable">
          <thead>
            <tr>
              <th>Service</th>
              <th>Used</th>
              <th>Limit</th>
              <th>Remaining</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Perplexity Tab -->
    <div class="tab-content" id="perplexity">
      <div class="section glow">
        <h2>Perplexity.ai Settings</h2>
        
        <!-- Iframe -->
        <div class="iframe-container">
          <iframe 
            src="https://www.perplexity.ai/rest/user/settings" 
            width="100%" 
            height="250" 
            frameborder="0"
            sandbox="allow-same-origin allow-scripts allow-forms">
          </iframe>
        </div>

        <!-- Table -->
        <h3>Parsed Limits</h3>
        <div class="table-container">
          <table class="limits-table">
            <thead>
              <tr>
                <th>Service</th>
                <th>Used</th>
                <th>Limit</th>
                <th>Remaining</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="perplexityTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div class="tab-content" id="settings">
      <div class="section glow">
        <h3>Add Service</h3>
        <div class="form-group">
          <input type="text" id="serviceName" placeholder="Service Name" class="input-neon">
          <input type="number" id="maxLimit" placeholder="Max Limit" class="input-neon">
          <button id="addService" class="btn-neon">Add Service</button>
        </div>
      </div>
      <div class="section glow">
        <h3>Controls</h3>
        <div class="button-group">
          <button id="resetAll" class="btn-neon">Reset All</button>
          <button id="exportData" class="btn-neon">Export</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
